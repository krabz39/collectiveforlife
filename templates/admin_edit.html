<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Item — Collective for Life</title>

<style>
:root {
  --dark:#021024;
  --mid:#052659;
  --mist:#7DA0CA;
  --steam:#C1E8FF;
}

/* PAGE */
body {
  font-family:'Inter',sans-serif;
  background:var(--steam);
  margin:0;
  padding:20px;
  color:var(--dark);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
h1 {
  color:var(--mid);
  text-align:center;
  margin-bottom:20px;
  font-size:1.8rem;
  font-weight:800;
}

/* PREVIEW IMAGE */
.preview {
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:20px;
}
.preview img {
  max-width:160px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  transition:.25s;
}
.preview img:hover {
  transform:scale(1.05);
}

/* FORM */
form {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
  max-width:720px;
  width:100%;
}

input,select,textarea {
  padding:12px;
  border:1px solid var(--mid);
  border-radius:8px;
  font-size:15px;
  flex:1 1 46%;
  min-width:140px;
  transition:.3s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--dark);
  outline:none;
}

textarea {
  min-height:70px;
  resize:vertical;
}

input[type=file] {
  flex:1 1 100%;
  background:#e8f5ff;
  border:1px dashed var(--mid);
  padding:14px;
  border-radius:10px;
}

/* CHECKBOX SECTION STYLE */
.option-toggle-box {
  flex:1 1 100%;
  padding:12px;
  border:1px solid var(--mist);
  border-radius:10px;
  background:#f5f9ff;
  margin-top:8px;
}

.option-toggle {
  display:flex;
  align-items:center;
  gap:10px;
  margin:6px 0;
  font-size:15px;
  font-weight:600;
  color:var(--dark);
}

/* BUTTONS */
button {
  background:var(--mid);
  color:white;
  border:none;
  border-radius:8px;
  padding:12px 15px;
  cursor:pointer;
  flex:1 1 100%;
  font-size:15px;
  font-weight:600;
  transition:.25s;
}
button:hover { background:var(--dark); }

.translate-btn, .add-cat-btn {
  background:var(--mist);
  color:var(--dark);
  border:none;
  padding:10px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  flex:0 0 auto;
  font-weight:600;
}
.translate-btn:hover, .add-cat-btn:hover {
  background:var(--mid);
  color:white;
}

/* BACK BUTTON */
a.back {
  margin-top:22px;
  text-decoration:none;
  background:var(--dark);
  color:white;
  padding:12px 20px;
  border-radius:10px;
  font-weight:600;
}
a.back:hover { background:var(--mid); }

/* MOBILE */
@media(max-width:768px){
  form{ padding:18px; }
  input,select,button,textarea{ width:100%; flex:1 1 100%; font-size:16px; }
  .translate-btn,.add-cat-btn{ width:100%; }
}
@media(max-width:480px){
  h1{ font-size:1.45rem; }
}
</style>
</head>

<body>

<h1>Edit Menu Item</h1>

<!-- IMAGE PREVIEW -->
<div class="preview">
  {% if item.image %}
    <img id="previewImage" src="{{ url_for('static', filename='uploads/' ~ item.image) }}" alt="Preview">
  {% else %}
    <img id="previewImage" src="" alt="Preview" style="display:none;">
    <p id="noImageText" style="color:#777;">No image uploaded</p>
  {% endif %}
</div>

<!-- FORM -->
<form method="POST" enctype="multipart/form-data" id="editForm">

  <!-- NAME EN -->
  <div style="display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap;">
    <input type="text" id="name_en" name="name_en" value="{{ item.name_en }}" placeholder="Name (English)" required style="flex:1 1 70%;">
    <button type="button" class="translate-btn" onclick="translateField('en')" style="flex:1 1 25%;">🌐 EN → AR</button>
  </div>

  <!-- NAME AR -->
  <div style="display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap;">
    <input type="text" id="name_ar" name="name_ar" value="{{ item.name_ar }}" placeholder="Name (Arabic)" required style="flex:1 1 70%;">
    <button type="button" class="translate-btn" onclick="translateField('ar')" style="flex:1 1 25%;">🌐 AR → EN</button>
  </div>

  <!-- CATEGORY -->
  <div style="display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap;">
    <select name="category" id="categorySelect" required style="flex:1 1 70%;">
      {% for cat in categories %}
        <option value="{{cat}}" {% if item.category == cat %}selected{% endif %}>{{cat}}</option>
      {% endfor %}
    </select>
    <button type="button" class="add-cat-btn" onclick="addCategory()" style="flex:1 1 25%;">➕ Add</button>
  </div>

  <!-- ORIGIN / PROCESS / FLAVORS / PRICE -->
  <input type="text" name="origin" value="{{ item.origin }}" placeholder="Origin (e.g. Kenya)">
  <input type="text" name="process" value="{{ item.process }}" placeholder="Process (e.g. Washed)">
  <input type="text" name="flavors" value="{{ item.flavors }}" placeholder="Flavors (comma-separated)">
  <input type="text" name="price" value="{{ item.price }}" placeholder="Price (KWD)" required>

  <!-- MILK JSON -->
  <textarea name="milk_prices" placeholder='Milk Extra Pricing (JSON)&#10;{"Oat Milk":0.250,"Lactose Free":0.150}'>{{ item.milk_prices }}</textarea>

  <!-- EXTRA MILK FIELD -->
  <input type="text" name="milk_extra_price" value="{{ item.milk_extra_price }}" placeholder="Extra Milk Price (KWD)">

  <!-- VARIANTS JSON -->
  <textarea name="variants" placeholder='Variants (JSON)&#10;["Hot","Iced"]'>{{ item.variants }}</textarea>

  <!-- ⭐⭐ NEW — DRINK OPTION VISIBILITY TOGGLES -->
  <div class="option-toggle-box">
    <label class="option-toggle">
      <input type="checkbox" name="use_milk" value="1" {% if item.use_milk == 1 %}checked{% endif %}>
      Enable Milk Options
    </label>

    <label class="option-toggle">
      <input type="checkbox" name="use_variant" value="1" {% if item.use_variant == 1 %}checked{% endif %}>
      Enable Hot / Iced Variants
    </label>

    <label class="option-toggle">
      <input type="checkbox" name="use_cup" value="1" {% if item.use_cup == 1 %}checked{% endif %}>
      Enable Ceramic / Takeaway
    </label>

    <label class="option-toggle">
      <input type="checkbox" name="use_extrashot" value="1" {% if item.use_extrashot == 1 %}checked{% endif %}>
      Enable Extra Shot
    </label>
  </div>
  <!-- END NEW SECTION -->

  <!-- STOCK QUANTITY -->
  <input type="number" name="stock_quantity" value="{{ item.stock_quantity }}" placeholder="Stock Quantity">

  <!-- STOCK STATUS -->
  <select name="stock_status" style="flex:1 1 100%;">
    <option value="Available" {% if item.stock_status == "Available" %}selected{% endif %}>Available</option>
    <option value="low" {% if item.stock_status == "low" %}selected{% endif %}>Almost Out</option>
    <option value="sold_out" {% if item.stock_status == "sold_out" %}selected{% endif %}>Sold Out</option>
  </select>

  <!-- IMAGE -->
  <input type="file" name="image" accept="image/*" id="imageInput" onchange="previewFile(event)">

  <!-- SAVE -->
  <button type="submit">💾 Save Changes</button>

</form>

<a href="/admin" class="back">← Back to Admin Dashboard</a>

<script>
// FIELD TRANSLATION
async function translateField(direction){
  const en = document.getElementById("name_en");
  const ar = document.getElementById("name_ar");
  const text = direction === "en" ? en.value : ar.value;

  if (!text.trim()) return alert("Enter text first!");

  try{
    const res = await fetch("/translate", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        text:text,
        target: direction === "en" ? "ar" : "en"
      })
    });

    const data = await res.json();
    if(data.translated){
      if(direction === "en") ar.value = data.translated;
      else en.value = data.translated;
    }
  } catch{
    alert("Translation unavailable.");
  }
}

// ADD CATEGORY
function addCategory(){
  const select = document.getElementById("categorySelect");
  const newCat = prompt("Enter new category name:");
  if(newCat && newCat.trim() !== ""){
    const opt = document.createElement("option");
    opt.value = newCat.trim();
    opt.textContent = newCat.trim();
    select.appendChild(opt);
    select.value = newCat.trim();
  }
}

// IMAGE PREVIEW
function previewFile(event){
  const file = event.target.files[0];
  const preview = document.getElementById("previewImage");
  const noText = document.getElementById("noImageText");

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      preview.src = e.target.result;
      preview.style.display = "block";
      if(noText) noText.style.display = "none";
    };
    reader.readAsDataURL(file);
  }
}
</script>

</body>
</html>
